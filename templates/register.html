{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 0 auto; padding: 10px;">
    <h2 style="text-align: center; margin-bottom: 20px;">{{ t('register') }}</h2>

    <form method="POST">
        <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">{{ t('username') }}</label>
        <input type="text" name="username" required autocomplete="off">

        <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">{{ t('password') }} (min. 8)</label>
        <input type="password" name="password" required minlength="8">

        <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">{{ t('birth_date') }}</label>
        <input type="date" name="birth_date" required>

        <button type="submit" style="width: 100%; margin-top: 10px;">{{ t('register') }}</button>
    </form>

    <p style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted);">
        {{ t('already_have_account') }} <a href="{{ url_for('main.login') }}" style="color: var(--text-color); font-weight: 700; text-decoration: none;">{{ t('login') }}</a>
    </p>
</div>
{% endblock %}
